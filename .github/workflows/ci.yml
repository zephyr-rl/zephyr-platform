name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zephyr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
      ZP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Tests (run the migrations, then 50+ tests against PostgreSQL)
        run: uv run pytest -q
      - name: Models and migrations agree
        run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t zephyr-platform:ci .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci ZP_SITE_ADDRESS=https://127.0.0.1 docker compose config -q
      - name: The whole stack starts (as on the VPS) and answers through Caddy
        run: |
          key() { python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("="))'; }
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-$(key)
          ZP_SECRET_KEYS=$(key)
          ZP_FINGERPRINT_KEY=$(key)
          ZP_SITE_ADDRESS=https://127.0.0.1
          ZP_TLS_MODE=internal
          ZP_DEFAULT_SNI=127.0.0.1
          EOF
          mkdir -p backups
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsk https://127.0.0.1/api/v1/ready; then echo; break; fi
            sleep 3
          done
          curl -fsk https://127.0.0.1/api/v1/ready
          curl -fsk -o /dev/null -w "panel: %{http_code}\n" https://127.0.0.1/
          docker compose ps
          docker compose run --rm api python -m app.cli --help > /dev/null
      - name: Logs when it failed
        if: failure()
        run: docker compose logs --tail=80

  # The Windows Server install (until the Linux VPS exists): build the kit and run it for real.
  windows-kit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the panel and the kit
        shell: powershell
        run: |
          Push-Location frontend; npm ci; npm run build; Pop-Location
          python scripts/build_windows_kit.py --out "$env:RUNNER_TEMP\kit"
      - name: INSTALL (as on the server)
        shell: powershell
        env:
          ZP_CI_OWNER_PASSWORD: ci-owner-password-1234
        run: |
          & "$env:RUNNER_TEMP\kit\scripts\install.ps1" -Root C:\ZP -OwnerEmail ci@example.com `
            -OwnerPasswordEnv ZP_CI_OWNER_PASSWORD -NonInteractive
      - name: Panel, sign-in, backup, check
        shell: powershell
        run: |
          $page = Invoke-WebRequest http://127.0.0.1:8600/ -UseBasicParsing
          if ($page.Content -notmatch 'id="root"') { throw 'The panel page is not served.' }
          $body = '{"email":"ci@example.com","password":"ci-owner-password-1234"}'
          $login = Invoke-WebRequest http://127.0.0.1:8600/api/v1/auth/login -Method Post -Body $body `
            -ContentType 'application/json' -UseBasicParsing
          if ($login.StatusCode -ne 200) { throw "Sign-in failed: $($login.StatusCode)" }
          Push-Location C:\ZP\app\backend
          & C:\ZP\venv\Scripts\python.exe -m app.deploy.backup --root C:\ZP
          if ($LASTEXITCODE -ne 0) { throw 'Backup failed.' }
          Pop-Location
          if (-not (Get-ChildItem C:\ZP\backups -Filter 'zephyr-*.dump')) { throw 'No dump.' }
          powershell -NoProfile -File C:\ZP\scripts\check.ps1 -Root C:\ZP
          if ($LASTEXITCODE -ne 0) { throw 'CHECK reported a problem.' }
          Get-Content C:\ZP\logs\supervisor.log
      - name: INSTALL again changes nothing, UPDATE, STOP, START
        shell: powershell
        env:
          ZP_CI_OWNER_PASSWORD: ci-owner-password-1234
        run: |
          $before = Get-Content C:\ZP\.env -Raw
          & "$env:RUNNER_TEMP\kit\scripts\install.ps1" -Root C:\ZP -NonInteractive
          if ((Get-Content C:\ZP\.env -Raw) -ne $before) { throw '.env changed on a second install.' }
          & "$env:RUNNER_TEMP\kit\scripts\update.ps1" -Root C:\ZP
          & C:\ZP\scripts\stop.ps1 -Root C:\ZP
          Start-Sleep -Seconds 3
          if (Get-NetTCPConnection -LocalPort 8600 -State Listen -ErrorAction SilentlyContinue) { throw 'Still running after STOP.' }
          & C:\ZP\scripts\start.ps1 -Root C:\ZP
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-kit-logs
          path: |
            C:\ZP\logs
            ${{ runner.temp }}\install-postgresql.log
            C:\Users\runneradmin\AppData\Local\Temp\install-postgresql.log
          if-no-files-found: ignore
