name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zephyr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
      ZP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Tests (run the migrations, then 50+ tests against PostgreSQL)
        run: uv run pytest -q
      - name: Models and migrations agree
        run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t zephyr-platform:ci .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci ZP_SITE_ADDRESS=https://127.0.0.1 docker compose config -q
