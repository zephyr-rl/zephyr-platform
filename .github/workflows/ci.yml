name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zephyr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ZP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
      ZP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zephyr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Tests (run the migrations, then 50+ tests against PostgreSQL)
        run: uv run pytest -q
      - name: Models and migrations agree
        run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t zephyr-platform:ci .
      - name: Compose file is valid
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=ci ZP_SITE_ADDRESS=https://127.0.0.1 docker compose config -q
      - name: The whole stack starts (as on the VPS) and answers through Caddy
        run: |
          key() { python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode().rstrip("="))'; }
          cat > .env <<EOF
          POSTGRES_PASSWORD=ci-$(key)
          ZP_SECRET_KEYS=$(key)
          ZP_FINGERPRINT_KEY=$(key)
          ZP_SITE_ADDRESS=https://127.0.0.1
          ZP_TLS_MODE=internal
          EOF
          mkdir -p backups
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsk https://127.0.0.1/api/v1/ready; then echo; break; fi
            sleep 3
          done
          curl -fsk https://127.0.0.1/api/v1/ready
          curl -fsk -o /dev/null -w "panel: %{http_code}\n" https://127.0.0.1/
          docker compose ps
          docker compose run --rm api python -m app.cli --help > /dev/null
      - name: Logs when it failed
        if: failure()
        run: docker compose logs --tail=80
